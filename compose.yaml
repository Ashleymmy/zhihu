name: zhihu-koc

# 生产环境：docker compose up -d（.env 会被自动读取）
# 首次部署：cp .env.docker.example .env 并填写所有必填项（.env 会被 compose 自动读取）

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 .env 中设置 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  # 全栈一体：后端 API + 门户/落地页 + 三端工作台（/admin /leader /creator）
  app:
    image: zhihu-koc:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?请在 .env 中设置 MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER:?请在 .env 中设置 MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379
      QUEUE_DRIVER: bull
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_PORT:-80}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - app_network

  # 数据库每日备份（凌晨 3 点，保留 14 天）
  backup:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    entrypoint: |
      sh -c '
        apk add --no-cache dcron >/dev/null 2>&1 || true
        echo "0 3 * * * mysqldump -h mysql -u root -p\"$$MYSQL_ROOT_PASSWORD\" --single-transaction --routines --triggers $$MYSQL_DATABASE | gzip > /backups/zhihu-koc-\$$(date +\%Y\%m\%d).sql.gz && find /backups -name \"*.sql.gz\" -mtime +14 -delete" > /etc/crontabs/root
        crond -f -l 2
      '
    volumes:
      - backup_data:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  # Prometheus 指标采集
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - app_network

  # Grafana 监控面板
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?请在 .env 中设置 GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana-dashboard.json:/var/lib/grafana/dashboards/zhihu-koc.json:ro
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    depends_on:
      - prometheus
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  backup_data:
  prometheus_data:
  grafana_data:
