name: zhihu-koc

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?请在 .env.docker 中设置 MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?请在 .env.docker 中设置 MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env.docker 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env.docker 中设置 MYSQL_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.docker}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - app_network

  server:
    image: zhihu-koc-server:${IMAGE_TAG:-latest}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${ENV_FILE:-.env.docker}
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:?请在 .env.docker 中设置 MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER:?请在 .env.docker 中设置 MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD:?请在 .env.docker 中设置 MYSQL_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env.docker 中设置 REDIS_PASSWORD}@redis:6379
      QUEUE_DRIVER: bull
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    networks:
      - app_network

  platform:
    image: zhihu-koc-platform:${IMAGE_TAG:-latest}
    build:
      context: ./platform
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-80}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
