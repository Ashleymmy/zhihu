services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zhihu_koc
      MYSQL_USER: zhihu
      MYSQL_PASSWORD: zhihu_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
      TZ: Asia/Shanghai
    ports: ["3306:3306"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["zhihu_mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uzhihu", "-pzhihu_local_password"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["zhihu_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  zhihu_mysql_data:
  zhihu_redis_data:
