<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIMO Web · 方向稿 v0.2 · 模块化卡片</title>
<style>
:root {
  --bg: #f3f1ea; --card: #ffffff; --card-2: #faf9f5; --hover: #f5f3ec;
  --ink: #141413; --ink-2: #3d3d3a; --ink-3: #5e5d59; --muted: #87867f; --faint: #b0aea5;
  --line: #e8e6dc; --line-2: #f0eee6;
  --clay: #d46b45; --clay-deep: #b5532f; --clay-soft: #f6e5dc;
  --c1: #d46b45; --c2: #3b7dd8; --c3: #4e9a4a; --c4: #8e6cc9;
  --ok: #2f7d4f; --ok-bg: #e3efe5; --warn: #a86a12; --warn-bg: #f5ead3; --bad: #b4402e; --bad-bg: #f6e1dc;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --r: 22px; --r-s: 14px;
  --sh: 0 1px 2px rgba(20,20,19,.03), 0 10px 30px -8px rgba(20,20,19,.08);
  --sh-hi: 0 2px 4px rgba(20,20,19,.04), 0 22px 48px -12px rgba(20,20,19,.16);
  --ease: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.34,1.4,.64,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.serif { font-family: var(--serif); }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ============ 外框：图标侧栏 + 主区 + 右栏 ============ */
.app { display: grid; grid-template-columns: 88px minmax(0, 1fr) 320px; min-height: 100vh; }
.app.no-rail { grid-template-columns: 88px minmax(0, 1fr); }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 0 18px; }
.logo { width: 44px; height: 44px; border-radius: 14px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--serif); font-size: 20px; font-weight: 600; margin-bottom: 18px; box-shadow: 0 8px 18px -6px rgba(20,20,19,.4); }
.rail a { position: relative; width: 64px; padding: 9px 0 7px; border-radius: 16px; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 11.5px; text-decoration: none; transition: background .2s, color .2s; cursor: pointer; }
.rail a:hover { color: var(--ink); background: rgba(255,255,255,.6); }
.rail a.on { color: var(--ink); background: var(--card); box-shadow: var(--sh); font-weight: 600; }
.rail a.on::before { content: ""; position: absolute; left: -12px; top: 50%; width: 4px; height: 20px; margin-top: -10px; border-radius: 0 3px 3px 0; background: var(--clay); }
.rail a .n { position: absolute; top: 4px; right: 12px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--clay); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.rail .sp { flex: 1; }
.me { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, #e08a63, #b5532f); }

.main { min-width: 0; padding: 22px 28px 48px 8px; }
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.top h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.2; }
.top p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.top .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; height: 42px; width: 260px; padding: 0 14px; border-radius: 14px; background: var(--card); box-shadow: var(--sh); color: var(--muted); font-size: 13.5px; }
.search kbd { margin-left: auto; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; font-family: var(--sans); }
.iconbtn { position: relative; width: 42px; height: 42px; border-radius: 14px; background: var(--card); box-shadow: var(--sh); display: grid; place-items: center; transition: transform .35s var(--spring); }
.iconbtn:active { transform: scale(.92); }
.iconbtn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--clay); border: 2px solid var(--card); }

/* 视图切换（演示用） */
.views { position: relative; display: inline-flex; padding: 4px; border-radius: 14px; background: rgba(255,255,255,.65); box-shadow: inset 0 0 0 1px var(--line); }
.views button { position: relative; z-index: 1; padding: 7px 14px; font-size: 13px; color: var(--ink-3); border-radius: 10px; transition: color .25s; white-space: nowrap; }
.views button.on { color: var(--ink); font-weight: 600; }
.views .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 10px; background: var(--card); box-shadow: 0 1px 3px rgba(20,20,19,.1); transition: transform .45s var(--spring), width .45s var(--spring); }

/* ============ Bento 网格与卡片 ============ */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; grid-auto-flow: dense; }
.card { position: relative; grid-column: span var(--s, 4); background: var(--card); border-radius: var(--r); padding: 22px; box-shadow: var(--sh); transition: transform .45s var(--spring), box-shadow .35s var(--ease); min-width: 0; will-change: transform; }
.card.lift:hover { transform: translateY(-4px); box-shadow: var(--sh-hi); }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h3 { font-size: 15px; font-weight: 650; }
.card-h .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.card-h .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.more { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); transition: background .2s, color .2s, transform .35s var(--spring); }
.more:hover { background: var(--hover); color: var(--ink); }
.more:active { transform: scale(.9); }
.big { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.15; letter-spacing: -.01em; }
.big small { font-size: .55em; margin-right: 2px; color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 650; }
.chip.up { color: var(--ok); background: var(--ok-bg); }
.chip.down { color: var(--bad); background: var(--bad-bg); }
.chip.soft { color: var(--ink-3); background: var(--hover); }
.chip.clay { color: var(--clay-deep); background: var(--clay-soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; background: var(--hover); transition: transform .35s var(--spring), background .2s; white-space: nowrap; }
.btn:hover { background: var(--line-2); }
.btn:active { transform: scale(.96); }
.btn.ink { background: var(--ink); color: var(--bg); }
.btn.ink:hover { background: #2b2b29; }
.btn.light { background: rgba(255,255,255,.14); color: #fff; }
.btn.light:hover { background: rgba(255,255,255,.22); }
.btn.white { background: #fff; color: var(--ink); }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 11px; background: var(--hover); }
.seg button { position: relative; z-index: 1; padding: 4px 10px; font-size: 12.5px; color: var(--muted); border-radius: 8px; transition: color .25s; }
.seg button.on { color: var(--ink); font-weight: 600; }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; left: 0; border-radius: 8px; background: var(--card); box-shadow: 0 1px 3px rgba(20,20,19,.1); transition: transform .4s var(--spring), width .4s var(--spring); }

/* 入场：错落浮现 */
.enter > * { animation: rise .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } }

/* 浮起的收益卡：深墨底 + 陶土光晕，跟随鼠标轻微倾斜 */
.wallet { color: #fff; background: radial-gradient(420px 220px at 100% 0%, rgba(212,107,69,.55), transparent 60%), radial-gradient(300px 200px at 0% 120%, rgba(142,108,201,.35), transparent 60%), linear-gradient(140deg, #1b1b19, #2b2a27 70%); overflow: hidden; transform-style: preserve-3d; z-index: 2; }
.wallet::after { content: ""; position: absolute; inset: 0; background: radial-gradient(260px circle at var(--gx, 70%) var(--gy, 20%), rgba(255,255,255,.14), transparent 60%); pointer-events: none; transition: opacity .3s; }
.wallet .lbl { opacity: .7; font-size: 13px; }
.wallet .big { color: #fff; font-size: 44px; margin: 6px 0 2px; }
.wallet .big small { color: rgba(255,255,255,.7); }
.wallet .meta { display: flex; gap: 26px; margin-top: 18px; font-size: 12.5px; color: rgba(255,255,255,.65); }
.wallet .meta b { display: block; color: #fff; font-size: 16px; font-weight: 650; }
.wallet .acts { display: flex; gap: 8px; margin-top: 22px; }
.wallet .spark { position: absolute; right: 18px; top: 22px; opacity: .9; }
.float { box-shadow: 0 30px 60px -20px rgba(20,20,19,.45), 0 8px 18px -8px rgba(20,20,19,.3); }

/* 图表 */
.chart { display: block; width: 100%; overflow: visible; }
.chart .grid { stroke: var(--line-2); }
.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--sans); }
.chart .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.3s var(--ease) .15s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .fadein { opacity: 0; animation: fade .9s ease .5s forwards; }
@keyframes fade { to { opacity: 1; } }
.chart .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow .8s var(--spring) forwards; animation-delay: calc(var(--i) * 45ms + .1s); }
@keyframes grow { to { transform: scaleY(1); } }
.chart .cross { opacity: 0; transition: opacity .15s; }
.chart:hover .cross { opacity: 1; }
.chart .cross line, .chart .cross circle { transition: transform .18s var(--ease); }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: #fff; padding: 8px 11px; border-radius: 10px; font-size: 12px; box-shadow: 0 10px 24px rgba(20,20,19,.25); opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; white-space: nowrap; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; font-size: 13px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.legend b { color: var(--ink); margin-left: 4px; }
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.ring circle.v { transition: stroke-dashoffset 1.4s var(--ease); }
.stack { display: flex; height: 12px; gap: 3px; border-radius: 6px; overflow: hidden; }
.stack i { display: block; height: 100%; flex: 0 0 0; transition: flex-grow 1.1s var(--ease); }
.stack i:first-child { border-radius: 6px 0 0 6px; } .stack i:last-child { border-radius: 0 6px 6px 0; }

/* 头像叠放 */
.avs { display: flex; }
.avs span { width: 36px; height: 36px; margin-left: -10px; border-radius: 50%; border: 3px solid var(--card); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; transition: transform .35s var(--spring); }
.avs span:first-child { margin-left: 0; }
.avs:hover span { transform: translateX(calc(var(--k) * 4px)); }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }

/* 列表 */
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line-2); }
.row:first-of-type { border-top: 0; }
.row .t { min-width: 0; flex: 1; }
.row .t b { display: block; font-weight: 600; font-size: 13.5px; }
.row .t small { color: var(--muted); font-size: 12px; }
.row .amt { font-weight: 650; }
.row .amt.pos { color: var(--ok); }

/* 项目卡（横向滚动，带抽象插画） */
.projects { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.proj { position: relative; overflow: hidden; border-radius: 18px; padding: 16px; background: var(--card-2); border: 1px solid var(--line-2); min-height: 168px; display: flex; flex-direction: column; justify-content: flex-end; transition: transform .45s var(--spring), box-shadow .35s; cursor: pointer; }
.proj:hover { transform: translateY(-4px); box-shadow: var(--sh-hi); }
.proj .art { position: absolute; inset: 0 0 auto 0; height: 92px; }
.proj b { font-size: 14.5px; }
.proj small { color: var(--muted); font-size: 12px; }
.proj .tg { position: absolute; top: 12px; right: 12px; }
.proj.add { border-style: dashed; background: transparent; color: var(--muted); align-items: center; justify-content: center; text-align: center; }

/* 右栏 */
.aside { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 22px 22px 22px 4px; display: flex; flex-direction: column; gap: 18px; }
.aside .card { padding: 20px; }
.profile { text-align: center; padding-top: 26px !important; }
.profile .big-av { width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #e08a63, #b5532f); box-shadow: 0 10px 24px -8px rgba(181,83,47,.6); }
.profile h4 { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.feed .it { display: flex; gap: 12px; align-items: center; padding: 10px 0; animation: rise .5s var(--ease) both; }
.feed .ic2 { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 15px; }
.feed .d { font-size: 11.5px; color: var(--muted); margin: 10px 0 2px; font-weight: 600; letter-spacing: .04em; }

/* 可展开卡片（FLIP） */
.card.expanded { --s: 12 !important; }

/* 面板（桌面居中，手机底部升起）与撤销提示 */
.stage { transition: transform .5s var(--ease), filter .5s var(--ease); transform-origin: 50% 30%; }
body.sheet-on .stage { transform: scale(.965); filter: brightness(.9) saturate(.9); }
.scrim { position: fixed; inset: 0; z-index: 70; background: rgba(20,20,19,.18); opacity: 0; pointer-events: none; transition: opacity .35s; }
body.sheet-on .scrim { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; z-index: 80; left: 50%; top: 50%; width: min(440px, calc(100% - 32px)); background: var(--card); border-radius: 26px; padding: 26px; box-shadow: 0 40px 80px -20px rgba(20,20,19,.35); transform: translate(-50%, -44%) scale(.96); opacity: 0; pointer-events: none; transition: transform .55s var(--spring), opacity .3s; }
body.sheet-on .sheet { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
.sheet h3 { font-size: 18px; font-weight: 650; }
.amount-in { font-family: var(--serif); font-size: 44px; font-weight: 600; margin: 14px 0 4px; }
.quick { display: flex; gap: 8px; margin: 14px 0 20px; }
.quick button { flex: 1; height: 38px; border-radius: 12px; background: var(--hover); font-weight: 600; transition: transform .3s var(--spring), background .2s; }
.quick button.on { background: var(--ink); color: var(--bg); }
.toast { position: fixed; z-index: 95; left: 50%; bottom: 28px; transform: translate(-50%, 160%); opacity: 0; visibility: hidden; display: flex; align-items: center; gap: 14px; padding: 11px 12px 11px 18px; border-radius: 16px; background: var(--ink); color: #fff; font-size: 13.5px; box-shadow: 0 16px 40px rgba(20,20,19,.3); transition: transform .5s var(--spring), opacity .25s, visibility .5s; white-space: nowrap; }
.toast.on { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform .5s var(--spring), opacity .2s; }
.toast button { color: #f0b49b; font-weight: 700; padding: 4px 8px; border-radius: 8px; }
.toast button:hover { background: rgba(255,255,255,.1); }

/* 关系预览（运营视图） */
.mini-forest text { font-family: var(--sans); }
.pulse { animation: pulse 2.2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(47,125,79,.45); } 70% { box-shadow: 0 0 0 8px rgba(47,125,79,0); } 100% { box-shadow: 0 0 0 0 rgba(47,125,79,0); } }

/* 视图过渡（支持的浏览器用 View Transitions，其它退化为淡入） */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .45s; animation-timing-function: cubic-bezier(.32,.72,0,1); }

/* 手机底部 Tab */
.tabbar { display: none; }

/* ============ 响应式：卡片自适应重排 ============ */
@media (max-width: 1360px) {
  .app { grid-template-columns: 88px minmax(0, 1fr); }
  .aside { position: static; height: auto; grid-column: 2; padding: 0 28px 40px 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 1080px) {
  .bento .card { grid-column: span min(var(--s, 4) * 2, 12); }
  .bento .card[data-s-md] { grid-column: span var(--s-md); }
  .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .app { grid-template-columns: 1fr; }
  .rail { display: none; }
  .main { padding: 16px 14px 100px; }
  .aside { grid-column: 1; grid-template-columns: 1fr; padding: 0 14px 100px; }
  .top { flex-wrap: wrap; } .top h1 { font-size: 24px; } .search { display: none; }
  .views { order: 3; width: 100%; overflow-x: auto; }
  .bento { gap: 12px; } .bento .card { grid-column: span 12 !important; padding: 18px; }
  .projects { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wallet .big { font-size: 36px; }
  .sheet { top: auto; bottom: 0; left: 0; width: 100%; border-radius: 26px 26px 0 0; transform: translateY(100%); padding-bottom: 34px; }
  body.sheet-on .sheet { transform: none; }
  .tabbar { display: flex; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 60; height: 64px; border-radius: 22px; background: rgba(255,255,255,.82); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); box-shadow: var(--sh-hi); }
  .tabbar a { flex: 1; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
  .tabbar a.on { color: var(--ink); font-weight: 600; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
<div class="app" id="app">
  <nav class="rail" id="rail"></nav>
  <main class="main">
    <header class="top">
      <div><h1 id="greet">下午好，林小满</h1><p id="subline">10 月 19 日 · 星期一</p></div>
      <span class="sp"></span>
      <div class="views" id="views"><span class="thumb"></span><button class="on" data-v="creator">达人首页</button><button data-v="leader">团长 · 我的团队</button><button data-v="ops">运营 · 总览</button></div>
      <div class="search">⌕ 搜索成员、项目、账单<kbd>Ctrl K</kbd></div>
      <button class="iconbtn" aria-label="通知">🔔<span class="dot"></span></button>
    </header>
    <section class="bento enter" id="view"></section>
  </main>
  <aside class="aside enter" id="aside"></aside>
</div>
</div>
<nav class="tabbar"><a class="on">⌂<span>首页</span></a><a>☰<span>任务</span></a><a>¥<span>收益</span></a><a>✚<span>邀请</span></a><a>◎<span>我的</span></a></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div style="display:flex;align-items:center"><h3>申请提现</h3><button class="more" style="margin-left:auto" data-close>✕</button></div>
  <p class="muted" style="font-size:13px;margin-top:4px">可提现 ¥2,001.02 · 到账微信零钱（林*满）</p>
  <div class="amount-in num" id="amt">¥500.00</div>
  <p class="muted" style="font-size:12.5px" id="fee">手续费 ¥3.00 · 实际到账 ¥497.00 · 预计明天到账</p>
  <div class="quick"><button data-a="200">¥200</button><button data-a="500" class="on">¥500</button><button data-a="1000">¥1,000</button><button data-a="2001.02">全部</button></div>
  <button class="btn ink" style="width:100%;height:46px;font-size:15px" data-close data-done id="confirmBtn">确认提现 ¥500.00</button>
</div>
<div class="toast" id="toast"><span id="toastT">已同意 周时雨 加入团队</span><button id="undo">撤销</button></div>
<div class="tip" id="tip"></div>

<script>
(function () {
  'use strict';
  const $ = (s, el) => (el || document).querySelector(s), $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const fmt = (v, d = 2) => v.toLocaleString('zh-CN', { minimumFractionDigits: d, maximumFractionDigits: d });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- 侧栏 ---------- */
  const NAV = {
    creator: [['⌂', '首页', 1], ['▦', '项目'], ['☰', '任务'], ['¥', '收益'], ['✚', '邀请'], ['◎', '我的']],

        <div class="row" data-jr="程星河"><span class="av" style="background:#3b7dd8">程</span><div class="t"><b>程星河</b><small>独立达人 · 活跃 17 天</small></div><button class="btn ink" style="height:30px;padding:0 12px" data-accept>同意</button></div></div>
        <p class="muted" style="font-size:12px;margin-top:10px">同意后从今天起计入团队，历史业绩不受影响。5 秒内可撤销。</p></div>
      <div class="card lift" style="--s:7"><div class="card-h"><h3>团队收益趋势</h3><span class="muted" style="font-size:12.5px">按项目</span></div>
        <div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c1)"></i>知乎</span><span><i style="background:var(--c2)"></i>红果</span><span><i style="background:var(--c3)"></i>网盘</span></div>
        <svg class="chart" data-chart="team"></svg></div>
      <div class="card lift" style="--s:5"><div class="card-h"><h3>最近流转</h3></div>
        ${[['#4e9a4a', '周时雨 申请加入', '今天 · 独立达人转入'], ['#d46b45', '林小满 晋升进度 3/4', '达标后由运营提名'], ['#b0aea5', '许南乔 由 林小满 邀请加入', '10-12 · 团队下级 +1'], ['#3b7dd8', '顾知夏 完成首单', '10-09']].map(x => `<div class="row"><span style="width:10px;height:10px;border-radius:50%;background:${x[0]};flex:none"></span><div class="t"><b>${x[1]}</b><small>${x[2]}</small></div></div>`).join('')}</div>`,
      aside: () => `
      <div class="card profile"><div class="big-av" style="background:linear-gradient(135deg,#5b8fe0,#2d63ae);box-shadow:0 10px 24px -8px rgba(45,99,174,.6)">苏</div><h4>苏禾</h4><p class="muted" style="font-size:12.5px">团长 · 自 2026-03-26</p>
        <div style="margin-top:16px">${ring(.82, 'var(--c2)', 120, '82%')}</div><p class="muted" style="font-size:12px">团队活跃度</p></div>
      <div class="card"><div class="card-h"><h3>本月团队收益</h3></div><div class="big num"><small>¥</small><span data-to="1032.4" data-d="2">0</span></div><p class="muted" style="font-size:12.5px">成员业绩 × 团长单价，按业绩当天归属计算</p></div>`,
      after() {
        barChart($('[data-chart="contrib"]'), [['林小满', 118.2], ['顾知夏', 96.4], ['唐南乔', 71.1], ['陈子衿', 40.55], ['宋初九', 36.2], ['何半夏', 28.9], ['韩岁宁', 21.4], ['谢时雨', 12.6]].map(([l, v], i) => ({ l, v, c: i < 3 ? 'var(--c1)' : '#e6c4b4', label: i < 3 })), { fmt: v => '¥' + v.toFixed(0) });
        lineChart($('[data-chart="team"]'), [{ n: '知乎', c: '#d46b45', v: wave(30, 10, 3.4, 0), area: true }, { n: '红果', c: '#3b7dd8', v: wave(18, 7, 2.8, 1) }, { n: '网盘', c: '#4e9a4a', v: wave(8, 4, 2.2, 2) }], days, { yfmt: v => '¥' + v, tfmt: v => '¥' + v.toFixed(2), h: 220 });
      }
    },

    ops: {
      greet: '运营总览', sub: '陈墨 · 运营管理 · 数据 3 分钟前同步',
      html: () => `
      ${[['上游收入', 62480, '↑ 32.9%', 'up', 'var(--c1)'], ['成员收益支出', 48360, '占上游 77.4%', 'soft', 'var(--c2)'], ['平台留存', 14120, '留存率 22.6%', 'soft', 'var(--c3)'], ['活跃成员', 108, '↑ 31.7%', 'up', 'var(--c4)']].map(k => `<div class="card lift" style="--s:3"><div class="card-h"><span style="width:8px;height:8px;border-radius:2px;background:${k[4]}"></span><h3 style="font-weight:500;color:var(--ink-3)">${k[0]}</h3></div><div class="big num" style="font-size:30px">${k[0] === '活跃成员' ? '' : '<small>¥</small>'}<span data-to="${k[1]}" data-d="0">0</span></div><span class="chip ${k[3]}" style="margin-top:8px">${k[2]}</span></div>`).join('')}
      <div class="card lift" style="--s:8" data-expandable><div class="card-h"><h3>上游收入</h3><span class="muted" style="font-size:12.5px">按项目 · 每日</span><div class="r"><div class="seg" data-seg><span class="thumb"></span><button>7 天</button><button class="on">30 天</button><button>90 天</button></div><button class="more" data-expand>⤢</button></div></div>
        <div class="legend" style="margin-bottom:6px"><span><i style="background:var(--c1)"></i>知乎<b>¥2.9 万</b></span><span><i style="background:var(--c2)"></i>红果<b>¥2.5 万</b></span><span><i style="background:var(--c3)"></i>网盘<b>¥7.2k</b></span></div>
        <svg class="chart" data-chart="up"></svg></div>
      <div class="card lift" style="--s:4"><div class="card-h"><h3>待办</h3><span class="chip clay r">3</span></div>
        ${[['♛', '3 位晋升候选人待提名', '系统按公开标准筛出', 'var(--clay-soft)', 'var(--clay-deep)'], ['◈', '10 月团队激励待拟定', '已按公开标准生成', '#efe9f8', '#6e4fa8'], ['⚠', '2 条疑似重复作品', '可一键合并，5 秒内可撤销', 'var(--warn-bg)', 'var(--warn)']].map(x => `<div class="row" style="cursor:pointer"><span class="ic2" style="width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:${x[3]};color:${x[4]}">${x[0]}</span><div class="t"><b>${x[1]}</b><small>${x[2]}</small></div><span class="muted">›</span></div>`).join('')}</div>
      <div class="card lift" style="--s:5"><div class="card-h"><h3>关系森林</h3><span class="muted r" style="font-size:12px">实线 = 当前团队 · 虚线 = 原始邀请</span></div><svg class="chart mini-forest" data-chart="forest"></svg></div>
      <div class="card lift" style="--s:4"><div class="card-h"><h3>团队排行</h3><span class="muted r" style="font-size:12px">上游贡献</span></div><svg class="chart" data-chart="rank"></svg></div>
      <div class="card lift" style="--s:3"><div class="card-h"><h3>留存构成</h3></div><div style="display:grid;place-items:center">${ring(.226, 'var(--c3)', 128, '22.6%')}</div>
        <div style="font-size:12.5px;margin-top:10px;line-height:1.9">${[['项目单价差', '¥1.3 万'], ['无团长差价', '¥601'], ['邀请满 180 天', '¥21']].map(x => `<div style="display:flex"><span class="muted">${x[0]}</span><b style="margin-left:auto">${x[1]}</b></div>`).join('')}</div></div>`,
      aside: () => `
      <div class="card"><div class="card-h"><h3>Worker 状态</h3><span class="r" style="display:flex;align-items:center;gap:6px;color:var(--ok);font-size:12.5px"><span class="pulse" style="width:8px;height:8px;border-radius:50%;background:var(--ok)"></span>正常</span></div>
        ${[['知乎同步', '3 分钟前'], ['红果同步', '11 分钟前'], ['收益计算队列', '0 条'], ['归属一致性巡检', '0 条差异']].map(x => `<div style="display:flex;font-size:13px;padding:6px 0"><span class="muted">${x[0]}</span><b style="margin-left:auto">${x[1]}</b></div>`).join('')}</div>
      <div class="card feed"><div class="card-h"><h3>实时动态</h3><span class="r muted" style="font-size:12px">● 自动刷新</span></div><div id="opsfeed"></div></div>`,
      after() {
        lineChart($('[data-chart="up"]'), [{ n: '知乎', c: '#d46b45', v: wave(980, 220, 3.2, .2), area: true }, { n: '红果', c: '#3b7dd8', v: wave(820, 180, 2.7, 1.1) }, { n: '网盘', c: '#4e9a4a', v: wave(240, 60, 2.2, 2.2) }], days, { yfmt: v => v >= 1000 ? '¥' + (v / 1000).toFixed(1) + 'k' : '¥' + v, tfmt: v => '¥' + v.toLocaleString('zh-CN'), h: 230 });
        barChart($('[data-chart="rank"]'), [['温嘉树', 13.1], ['苏禾', 12.2], ['唐知远', 9.5], ['宋北辰', 9.0], ['何若溪', 8.9], ['江照野', 2.9]].map(([l, v], i) => ({ l, v, c: i === 5 ? 'var(--c4)' : 'var(--c2)', label: i < 2 })), { fmt: v => v.toFixed(1) + 'k', h: 210 });
        forest($('[data-chart="forest"]'));
        opsFeed();
      }
    }
  };

  /* 关系森林缩略图：节点逐个浮现，连线随后画出 */
  function forest(svg) {
    const N = [['唐知远', 20, 60, 1], ['江照野', 170, 30, 1], ['宋初九', 170, 96, 0], ['韩岁宁', 320, 10, 0], ['谢时雨', 320, 56, 0], ['方见山', 320, 102, 0], ['苏禾', 20, 160, 1], ['林小满', 170, 150, 0], ['许南乔', 320, 150, 2]];
    const E = [[0, 1, 'd'], [0, 2, 's'], [1, 3, 's'], [1, 4, 's'], [1, 5, 'd'], [6, 7, 's'], [7, 8, 'd']];
    let g = '';
    E.forEach(([a, b, t], i) => { const A = N[a], B = N[b], x1 = A[1] + 104, y1 = A[2] + 15, x2 = B[1], y2 = B[2] + 15, mx = (x1 + x2) / 2; g += `<path class="draw" style="animation-delay:${.4 + i * .06}s" d="M${x1} ${y1}C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${t === 'd' ? '#d46b45' : '#b0aea5'}" stroke-width="1.6" ${t === 'd' ? 'data-dash="1"' : ''}/>`; });
    N.forEach((n, i) => { g += `<g class="fadein" style="animation-delay:${.05 + i * .05}s"><rect x="${n[1]}" y="${n[2]}" width="104" height="30" rx="9" fill="${n[3] === 1 ? '#141413' : n[3] === 2 ? '#efede6' : '#fff'}" stroke="#e0ddd2"/><text x="${n[1] + 12}" y="${n[2] + 19.5}" font-size="12" font-weight="600" fill="${n[3] === 1 ? '#faf9f5' : n[3] === 2 ? '#87867f' : '#141413'}">${n[0]}</text></g>`; });
    svg.setAttribute('viewBox', '0 0 430 190'); svg.innerHTML = g;
    $$('path.draw', svg).forEach(p => { const L = p.getTotalLength(); p.style.setProperty('--len', L); if (p.dataset.dash) p.addEventListener('animationend', () => { p.classList.remove('draw'); p.setAttribute('stroke-dasharray', '5 4'); }, { once: true }); });
  }

  let feedTimer;
  function opsFeed() {
    const box = $('#opsfeed'); if (!box) return;
    const pool = [['孟*宁', '网盘 2 人', '+¥9.00', '#4e9a4a'], ['许*念', '红果 23 次', '+¥27.60', '#3b7dd8'], ['方*乔', '知乎 4 单', '+¥12.00', '#d46b45'], ['袁*宁', '知乎 8 单', '+¥24.00', '#d46b45'], ['林*满', '知乎 3 单', '+¥9.00', '#d46b45']];
    const add = () => { const p = pool[Math.floor(Math.random() * pool.length)], t = new Date().toTimeString().slice(0, 5); box.insertAdjacentHTML('afterbegin', `<div class="it"><span class="ic2" style="background:${p[3]}22;color:${p[3]}">●</span><div class="t" style="flex:1"><b style="font-size:13px">${p[0]} · ${p[1]}</b><div class="muted" style="font-size:12px">${t}</div></div><b class="amt pos">${p[2]}</b></div>`); while (box.children.length > 6) box.lastElementChild.remove(); };
    for (let i = 0; i < 5; i++) add();
    clearInterval(feedTimer); feedTimer = setInterval(add, 2800);
  }

  /* ---------- 渲染与过渡 ---------- */
  let cur = 'creator';
  function render(v) {
    const V = VIEWS[v];
    clearInterval(feedTimer);
    $('#greet').textContent = V.greet; $('#subline').textContent = V.sub;
    rail(v);
    const view = $('#view'), aside = $('#aside');
    view.innerHTML = V.html(); aside.innerHTML = V.aside();
    [view, aside].forEach(el => { el.classList.remove('enter'); void el.offsetWidth; el.classList.add('enter'); Array.from(el.children).forEach((c, i) => c.style.setProperty('--i', i)); });
    V.after && V.after();
    $$('[data-to]').forEach(el => { if (el.tagName === 'circle') return; setTimeout(() => countUp(el), 250); });
    setTimeout(() => $$('circle.v').forEach(c => c.setAttribute('stroke-dashoffset', c.dataset.to)), 300);
    setTimeout(() => $$('[data-stack] i').forEach(i => i.style.flexGrow = i.dataset.f), 300);
    $$('#view [data-seg], #aside [data-seg]').forEach(s => bindSeg(s));
    bindTilt(); bindExpand();
  }
  function switchView(v) {
    if (v === cur) return; cur = v;
    if (document.startViewTransition && !reduce) document.startViewTransition(() => render(v)); else render(v);
  }
  bindSeg($('#views'), b => switchView(b.dataset.v));

  /* ---------- 悬浮卡片倾斜 ---------- */
  function bindTilt() {
    $$('[data-tilt]').forEach(card => {
      card.addEventListener('pointermove', e => {
        if (reduce) return;
        const r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
        card.style.transform = `perspective(900px) rotateX(${(.5 - py) * 7}deg) rotateY(${(px - .5) * 9}deg) translateY(-4px)`;
        card.style.setProperty('--gx', px * 100 + '%'); card.style.setProperty('--gy', py * 100 + '%');
      });
      card.addEventListener('pointerleave', () => { card.style.transform = ''; });
    });
  }

  /* ---------- 卡片展开：FLIP 让其它卡片平滑让位 ---------- */
  function bindExpand() {
    $$('[data-expand]').forEach(btn => btn.addEventListener('click', () => {
      const card = btn.closest('.card'), cards = $$('#view > .card');
      const first = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
      card.classList.toggle('expanded'); btn.textContent = card.classList.contains('expanded') ? '⤡' : '⤢';
      cards.forEach(c => {
        const a = first.get(c), b = c.getBoundingClientRect();
        const dx = a.left - b.left, dy = a.top - b.top, sx = a.width / b.width, sy = a.height / b.height;
        if (!dx && !dy && sx === 1 && sy === 1) return;
        c.animate([{ transformOrigin: 'top left', transform: `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})` }, { transformOrigin: 'top left', transform: 'none' }], { duration: reduce ? 0 : 560, easing: 'cubic-bezier(.32,.72,0,1)' });
      });
      setTimeout(redraw, reduce ? 0 : 420);
    }));
  }

  /* ---------- 提现面板 ---------- */
  document.addEventListener('click', e => {
    if (e.target.closest('[data-open]')) document.body.classList.add('sheet-on');
    const close = e.target.closest('[data-close]');
    if (close) { document.body.classList.remove('sheet-on'); if (close.hasAttribute('data-done')) toast('提现申请已提交 · 预计明天到账', null); }
    const q = e.target.closest('.quick button');
    if (q) { $$('.quick button').forEach(b => b.classList.toggle('on', b === q)); const a = parseFloat(q.dataset.a), fee = Math.round(a * 0.6) / 100; $('#amt').textContent = '¥' + fmt(a); $('#fee').textContent = `手续费 ¥${fmt(fee)} · 实际到账 ¥${fmt(a - fee)} · 预计明天到账`; $('#confirmBtn').textContent = `确认提现 ¥${fmt(a)}`; }
    const acc = e.target.closest('[data-accept]');
    if (acc) {
      const row = acc.closest('.row'), name = row.dataset.jr, h = row.offsetHeight;
      row.animate([{ opacity: 1, height: h + 'px' }, { opacity: 0, height: '0px', paddingTop: 0, paddingBottom: 0 }], { duration: 380, easing: 'cubic-bezier(.32,.72,0,1)' }).onfinish = () => { row.style.display = 'none'; };
      const cnt = $('#jrCount'); cnt.textContent = Math.max(0, +cnt.textContent - 1);
      toast(`已同意 ${name} 加入团队`, () => { row.style.display = ''; row.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 }); cnt.textContent = +cnt.textContent + 1; });
    }
  });
  $('#scrim').addEventListener('click', () => document.body.classList.remove('sheet-on'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') document.body.classList.remove('sheet-on'); });

  let toastTimer, undoFn;
  function toast(msg, onUndo) {
    $('#toastT').textContent = msg; undoFn = onUndo; $('#undo').style.display = onUndo ? '' : 'none';
    const t = $('#toast'); t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 5000);
  }
  $('#undo').addEventListener('click', () => { if (undoFn) undoFn(); undoFn = null; $('#toast').classList.remove('on'); });

  function redraw() { const V = VIEWS[cur]; if (V.after) V.after(); }
  let rz; window.addEventListener('resize', () => { $$('.views, .seg').forEach(thumb); clearTimeout(rz); rz = setTimeout(redraw, 250); });
  window.TIMO_DEMO = { switchView };
  render('creator');
})();
</script>
</body>
</html>
