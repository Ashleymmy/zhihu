<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIMO · 全角色工作台原型 v3</title>
<style>
/* ============ 令牌（与 design-direction-v2 一致） ============ */
:root {
  --bg: #f3f1ea; --card: #ffffff; --card-2: #faf9f5; --hover: #f5f3ec;
  --ink: #141413; --ink-2: #3d3d3a; --ink-3: #5e5d59; --muted: #87867f; --faint: #b0aea5;
  --line: #e8e6dc; --line-2: #f0eee6;
  --clay: #d46b45; --clay-deep: #b5532f; --clay-soft: #f6e5dc;
  --c1: #d46b45; --c2: #3b7dd8; --c3: #4e9a4a; --c4: #8e6cc9;
  --ok: #2f7d4f; --ok-bg: #e3efe5; --warn: #a86a12; --warn-bg: #f5ead3; --bad: #b4402e; --bad-bg: #f6e1dc;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei UI", system-ui, sans-serif;
  --r: 22px; --r-s: 14px;
  --sh: 0 1px 2px rgba(20,20,19,.03), 0 10px 30px -8px rgba(20,20,19,.08);
  --sh-hi: 0 2px 4px rgba(20,20,19,.04), 0 22px 48px -12px rgba(20,20,19,.16);
  --ease: cubic-bezier(.32,.72,0,1);
  --spring: cubic-bezier(.34,1.4,.64,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.serif { font-family: var(--serif); }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; border-radius: 8px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ============ 外框：图标侧栏 + 主区 + 右栏 ============ */
.app { display: grid; grid-template-columns: 88px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 0 18px; z-index: 40; background: var(--bg); }
.logo { width: 44px; height: 44px; border-radius: 14px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--serif); font-size: 20px; font-weight: 600; margin-bottom: 18px; box-shadow: 0 8px 18px -6px rgba(20,20,19,.4); }
.rail a { position: relative; width: 64px; padding: 9px 0 7px; border-radius: 16px; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-size: 11.5px; cursor: pointer; transition: background .2s, color .2s; }
.rail a:hover { color: var(--ink); background: rgba(255,255,255,.6); }
.rail a.on { color: var(--ink); background: var(--card); box-shadow: var(--sh); font-weight: 600; }
.rail a.on::before { content: ""; position: absolute; left: -12px; top: 50%; width: 4px; height: 20px; margin-top: -10px; border-radius: 0 3px 3px 0; background: var(--clay); }
.rail a .n { position: absolute; top: 4px; right: 12px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--clay); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.rail .sp { flex: 1; }
.me { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; background: linear-gradient(135deg, #e08a63, #b5532f); }

.main { min-width: 0; padding: 22px 28px 48px 8px; }
.top { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
.top h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; line-height: 1.2; }
.top .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.top .sp { flex: 1; }
.search { display: flex; align-items: center; gap: 8px; height: 42px; width: 260px; padding: 0 14px; border-radius: 14px; background: var(--card); box-shadow: var(--sh); color: var(--muted); font-size: 13.5px; }
.search kbd { margin-left: auto; font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 6px; }
.iconbtn { position: relative; width: 42px; height: 42px; border-radius: 14px; background: var(--card); box-shadow: var(--sh); display: grid; place-items: center; transition: transform .35s var(--spring); }
.iconbtn:active { transform: scale(.92); }
.iconbtn .dot { position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--clay); border: 2px solid var(--card); }

/* 角色切换胶囊（预览完成度用）：收成一枚，点开出菜单 */
.rolepick { position: relative; }
.rp-btn { display: inline-flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; border-radius: 14px; background: var(--card); box-shadow: var(--sh); font-size: 13px; font-weight: 600; color: var(--ink-3); }
.rp-btn b { color: var(--ink); }
.rp-btn::after { content: "▾"; color: var(--muted); font-size: 11px; }
.rp-menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 60; min-width: 180px; padding: 6px; border-radius: 16px; background: var(--card); box-shadow: var(--sh-hi); display: grid; gap: 2px; }
.rp-menu[hidden] { display: none; }
.rp-menu button { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 11px; font-size: 13px; color: var(--ink-3); text-align: left; }
.rp-menu button:hover { background: var(--hover); color: var(--ink); }
.rp-menu button.on { color: var(--ink); font-weight: 650; background: var(--card-2); }
.rp-menu button.on::after { content: "✓"; color: var(--clay); font-weight: 700; }

/* ============ Bento 网格与卡片 ============ */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; grid-auto-flow: dense; }
.card { position: relative; grid-column: span var(--s, 4); background: var(--card); border-radius: var(--r); padding: 22px; box-shadow: var(--sh); transition: transform .45s var(--spring), box-shadow .35s var(--ease); min-width: 0; }
.card.lift:hover { transform: translateY(-4px); box-shadow: var(--sh-hi); }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h3 { font-size: 15px; font-weight: 650; }
.card-h .ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; }
.card-h .r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.big { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.15; letter-spacing: -.01em; }
.big small { font-size: .55em; margin-right: 2px; color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 650; white-space: nowrap; }
.chip.up { color: var(--ok); background: var(--ok-bg); }
.chip.down { color: var(--bad); background: var(--bad-bg); }
.chip.soft { color: var(--ink-3); background: var(--hover); }
.chip.clay { color: var(--clay-deep); background: var(--clay-soft); }
.chip.warn { color: var(--warn); background: var(--warn-bg); }
.chip.blue { color: var(--c2); background: #e3ecf8; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: 13.5px; background: var(--hover); transition: transform .35s var(--spring), background .2s; white-space: nowrap; }
.btn:hover { background: var(--line-2); }
.btn:active { transform: scale(.96); }
.btn.ink { background: var(--ink); color: var(--bg); }
.btn.ink:hover { background: #2b2b29; }
.btn.light { background: rgba(255,255,255,.14); color: #fff; }
.btn.white { background: #fff; color: var(--ink); }
.btn.sm { height: 30px; padding: 0 12px; font-size: 12.5px; border-radius: 10px; }
.seg { position: relative; display: inline-flex; padding: 3px; border-radius: 11px; background: var(--hover); }
.seg button { position: relative; z-index: 1; padding: 4px 10px; font-size: 12.5px; color: var(--muted); border-radius: 8px; transition: color .25s; }
.seg button.on { color: var(--ink); font-weight: 600; background: var(--card); box-shadow: 0 1px 3px rgba(20,20,19,.1); }
.enter > * { animation: rise .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } }

/* 钱包卡 */
.wallet { display: flex; flex-direction: column; color: #fff; background: radial-gradient(420px 220px at 100% 0%, rgba(212,107,69,.55), transparent 60%), radial-gradient(300px 200px at 0% 120%, rgba(142,108,201,.35), transparent 60%), linear-gradient(140deg, #1b1b19, #2b2a27 70%); overflow: hidden; z-index: 2; }
.wallet::after { content: ""; position: absolute; inset: 0; background: radial-gradient(260px circle at var(--gx, 70%) var(--gy, 20%), rgba(255,255,255,.14), transparent 60%); pointer-events: none; }
.wallet .lbl { opacity: .7; font-size: 13px; }
.wallet .big { color: #fff; font-size: 44px; margin: 6px 0 2px; }
.wallet .big small { color: rgba(255,255,255,.7); }
.wallet .meta { display: flex; gap: 26px; margin-top: 18px; font-size: 12.5px; color: rgba(255,255,255,.65); }
.wallet .meta b { display: block; color: #fff; font-size: 16px; font-weight: 650; }
.wallet .acts { display: flex; gap: 8px; margin-top: auto; padding-top: 22px; }
.wallet .spark { position: absolute; right: 18px; top: 22px; opacity: .9; }
.wallet .pill { display: inline-flex; gap: 6px; align-items: center; margin-top: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.12); font-size: 12px; color: rgba(255,255,255,.85); width: fit-content; }

/* 图表 */
.chart { display: block; width: 100%; overflow: visible; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-3); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.legend b { color: var(--ink); margin-left: 4px; }
.ring-wrap { display: flex; align-items: center; gap: 18px; }
.stack { display: flex; height: 12px; gap: 3px; border-radius: 6px; overflow: hidden; }
.stack i { display: block; height: 100%; }
.stack i:first-child { border-radius: 6px 0 0 6px; } .stack i:last-child { border-radius: 0 6px 6px 0; }

/* 头像、列表行、feed */
.avs { display: flex; }
.avs span { width: 36px; height: 36px; margin-left: -10px; border-radius: 50%; border: 3px solid var(--card); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
.avs span:first-child { margin-left: 0; }
.av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line-2); }
.row:first-of-type { border-top: 0; }
.row .t { min-width: 0; flex: 1; }
.row .t b { display: block; font-weight: 600; font-size: 13.5px; }
.row .t small { color: var(--muted); font-size: 12px; }
.row .amt { font-weight: 650; }
.row .amt.pos { color: var(--ok); }

/* 项目卡 */
.projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.proj { position: relative; overflow: hidden; border-radius: 18px; padding: 16px; background: var(--card-2); border: 1px solid var(--line-2); min-height: 168px; display: flex; flex-direction: column; justify-content: flex-end; transition: transform .45s var(--spring), box-shadow .35s; cursor: pointer; }
.proj:hover { transform: translateY(-4px); box-shadow: var(--sh-hi); }
.proj .art { position: absolute; inset: 0 0 auto 0; height: 92px; }
.proj b { font-size: 14.5px; }
.proj small { color: var(--muted); font-size: 12px; }
.proj .tg { position: absolute; top: 12px; right: 12px; }
.proj.add { border-style: dashed; background: transparent; color: var(--muted); align-items: center; justify-content: center; text-align: center; }

/* 右栏 */
.aside { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 18px; min-width: 0; padding-bottom: 8px; }
.aside::-webkit-scrollbar { display: none; }
.aside .card { padding: 20px; }
.profile { text-align: center; padding-top: 26px !important; }
.profile .big-av { width: 72px; height: 72px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 26px; font-weight: 700; background: linear-gradient(135deg, #e08a63, #b5532f); box-shadow: 0 10px 24px -8px rgba(181,83,47,.6); }
.profile h4 { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.feed .it { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
.feed .it + .it { border-top: 1px solid var(--line-2); }
.feed .ic2 { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 15px; }
.feed .d { font-size: 11.5px; color: var(--muted); margin: 10px 0 2px; font-weight: 600; letter-spacing: .04em; }
.feed .amt { font-weight: 650; white-space: nowrap; }

/* ============ 多维表格（核对跟进类列表） ============ */
.sheetcard { overflow: hidden; padding: 0; }
.sheet-toolbar { display: flex; align-items: center; gap: 10px; padding: 16px 18px 12px; flex-wrap: wrap; }
.sheet-toolbar .sp { flex: 1; }
.sheet-search { display: flex; align-items: center; gap: 8px; height: 36px; width: 240px; padding: 0 12px; border-radius: 11px; background: var(--card-2); border: 1px solid var(--line-2); color: var(--muted); font-size: 13px; }
.sheet-table { width: 100%; border-collapse: collapse; }
.sheet-table th { text-align: left; padding: 10px 18px; color: var(--muted); font-size: 12px; font-weight: 600; border-top: 1px solid var(--line-2); background: var(--card-2); }
.sheet-table td { padding: 13px 18px; border-top: 1px solid var(--line-2); font-size: 13.5px; vertical-align: middle; }
.sheet-table tr[data-click] { cursor: pointer; transition: background .15s; }
.sheet-table tr[data-click]:hover { background: var(--hover); }
.sheet-group td { background: var(--card-2); color: var(--ink-3); font-size: 12px; font-weight: 650; padding: 8px 18px; }
.sheet-foot { display: flex; justify-content: flex-end; gap: 18px; padding: 12px 18px; border-top: 1px solid var(--line-2); color: var(--muted); font-size: 12.5px; }
.sheet-foot b { color: var(--ink); font-family: var(--serif); font-size: 16px; }

/* 表单 */
.field { display: grid; gap: 6px; font-size: 13px; color: var(--ink-3); }
.field input, .field select, .field textarea { height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: inherit; font-size: 13.5px; }
.field textarea { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; }

/* 空态 */
.empty { display: grid; justify-items: center; gap: 8px; padding: 36px 18px; text-align: center; color: var(--muted); }
.empty b { color: var(--ink); font-size: 15px; }

/* 二维码占位 */
.qr { width: 120px; height: 120px; border-radius: 12px; background:
  linear-gradient(90deg, var(--ink) 8px, transparent 8px) 0 0/16px 16px,
  linear-gradient(var(--ink) 8px, transparent 8px) 0 0/16px 16px, var(--card-2);
  border: 6px solid var(--card); box-shadow: var(--sh); }

.home-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
@media (max-width: 1360px) { .home-grid { grid-template-columns: 1fr; } .aside { position: static; max-height: none; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 1080px) { .bento .card { grid-column: span min(var(--s, 4) * 2, 12) !important; } }
@media (max-width: 720px) {
  .main { padding: 16px 14px 40px; }
  .bento .card { grid-column: span 12 !important; padding: 18px; }
  .aside { grid-template-columns: 1fr; }
  .top h1 { font-size: 24px; }
  /* 多维表格窄屏变卡片 */
  .sheet-table thead { display: none; }
  .sheet-table, .sheet-table tbody { display: block; }
  .sheet-table tbody tr { display: block; padding: 12px 18px; border-top: 1px solid var(--line-2); }
  .sheet-table tbody tr.sheet-group { padding: 8px 18px; }
  .sheet-table td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 4px 0; border: 0; }
  .sheet-table td:first-child { display: block; }
  .sheet-foot { flex-wrap: wrap; gap: 8px 14px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <header class="top" id="top"></header>
    <section id="view"></section>
  </div>
</div>

<script>
/* =========================================================
 * TIMO 全角色工作台原型 v3
 * hash 路由：#/{role}/{page}
 * ========================================================= */
const $ = (s, r = document) => r.querySelector(s);

/* ---------- 角色与页面集 ---------- */
const ROLES = {
  creator: {
    label: '达人', who: { name: '林小满', tag: '苏禾团队 · 达人', av: '林' },
    pages: [
      ['home', '首页', '⌂'], ['projects', '项目', '▦'], ['tasks', '任务', '☰'],
      ['income', '收益', '¥'], ['invite', '邀请', '✚'], ['me', '我的', '◎'],
    ],
  },
  leader: {
    label: '团长', who: { name: '苏禾', tag: '团长 · 20 位成员', av: '苏' },
    pages: [
      ['home', '首页', '⌂'], ['projects', '项目', '▦'], ['team', '团队', '◉', 2],
      ['invite', '邀请', '✚'], ['income', '收益', '¥'], ['me', '我的', '◎'],
    ],
  },
  operator: {
    label: '运营', who: { name: '陈墨', tag: '运营管理 · 数据 3 分钟前同步', av: '陈' },
    pages: [
      ['home', '总览', '⌂'], ['workbench', '工作台', '▤'], ['members', '成员', '◉'],
      ['relations', '关系', '⟡'], ['promotions', '晋升', '♛', 3], ['incentive', '激励', '◈'], ['export', '导出', '⤓'],
    ],
  },
  finance: {
    label: '财务', who: { name: '王谨', tag: '财务管理', av: '王' },
    pages: [
      ['home', '总览', '⌂'], ['reconcile', '对账', '▤'], ['withdrawals', '提现', '¥', 4],
      ['rates', '计费', '◈'], ['export', '导出', '⤓'],
    ],
  },
  admin: {
    label: '管理员', who: { name: '系统管理员', tag: '完整管理员', av: '系' },
    pages: [
      ['home', '总览', '⌂'], ['members', '成员', '◉'], ['accounts', '账号岗位', '♛'],
      ['audit', '审计', '▤'], ['announce', '公告', '◈'], ['system', '系统', '⛭'],
    ],
  },
  developer: {
    label: '开发者', who: { name: '祁远', tag: '开发者 · 数据与队列', av: '祁' },
    pages: [
      ['home', '总览', '⌂'], ['data', '数据', '▦'], ['inspect', '巡检', '⟡'], ['queue', '队列', '☰'],
    ],
  },
};

/* ---------- 路由 ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, p] = h.split('/');
  const role = ROLES[r] ? r : 'creator';
  const page = ROLES[role].pages.some(([k]) => k === p) ? p : ROLES[role].pages[0][0];
  return { role, page };
}
function go(role, page) { location.hash = `#/${role}/${page}`; }
addEventListener('hashchange', render);

/* ---------- 外壳 ---------- */
function shell() {
  const { role, page } = route();
  const R = ROLES[role];
  $('#rail').innerHTML = `<div class="logo">T</div>` + R.pages.map(([k, t, i, n]) =>
    `<a class="${k === page ? 'on' : ''}" href="#/${role}/${k}"><span style="font-size:18px;line-height:1">${i}</span>${t}${n ? `<span class="n">${n}</span>` : ''}</a>`).join('')
    + `<span class="sp"></span><div class="me" title="${R.who.name}">${R.who.av}</div>`;
  const pageLabel = R.pages.find(([k]) => k === page)?.[1] ?? '';
  $('#top').innerHTML = `
    <div><h1>${role === 'creator' && page === 'home' ? '下午好，' + R.who.name : pageLabel}</h1><p class="sub">${R.who.tag}${role === 'creator' && page === 'home' ? ' · 10 月 19 日 星期一' : ''}</p></div>
    <div class="sp"></div>
    <div class="rolepick">
      <button class="rp-btn" id="rpBtn"><b>${R.label}</b>&nbsp;${R.who.name}</button>
      <div class="rp-menu" id="rpMenu" hidden>${Object.entries(ROLES).map(([k, v]) => `<button class="${k === role ? 'on' : ''}" data-role="${k}"><span>${v.label} · ${v.who.name}</span></button>`).join('')}</div>
    </div>
    <div class="search">⌕ 搜索成员、项目、账单<kbd>Ctrl K</kbd></div>
    <button class="iconbtn">◔<span class="dot"></span></button>`;
  const rpBtn = $('#rpBtn'), rpMenu = $('#rpMenu');
  rpBtn.addEventListener('click', e => { e.stopPropagation(); rpMenu.hidden = !rpMenu.hidden; });

const ring = (pct, color, size, label) => {
  const r = (size - 14) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="10"/><circle class="v" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" transform="rotate(-90 ${size / 2} ${size / 2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-family="var(--serif)" font-size="${size / 4.4}" font-weight="600" fill="var(--ink)">${label}</text></svg>`;
};
const trendSVG = (id, series, h = 210) => `<svg class="chart" id="${id}" data-line='${JSON.stringify(series)}' style="height:${h}px" viewBox="0 0 640 ${h}" preserveAspectRatio="none"></svg>`;
/* 演示波形 + 平滑折线绘制（延续 v2 charts 的视觉） */
const wave = (base, amp, k, ph, n = 30) => Array.from({ length: n }, (_, i) => Math.max(0, Math.round((base + amp * Math.sin(i / k + ph) + amp * .45 * Math.sin(i / 2.3 + ph * 2)) * 100) / 100));
function smoothPath(pts) {
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
    d += `C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function paintCharts() {
  document.querySelectorAll('svg.chart[data-line]').forEach(svg => {
    const series = JSON.parse(svg.dataset.line), W = 640, H = +svg.getAttribute('viewBox').split(' ')[3];
    const pl = 44, pr = 12, pt = 14, pb = 24, n = series[0].v.length;
    const max = Math.max(10, Math.ceil(Math.max(...series.flatMap(s => s.v)) * 1.15 / 50) * 50);
    const X = i => pl + i * (W - pl - pr) / (n - 1), Y = v => pt + (H - pt - pb) * (1 - v / max);
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${pl - 8}" y="${Y(v) + 4}" text-anchor="end" fill="var(--muted)" font-size="11">¥${v}</text>`; }
    const step = Math.ceil(n / 6);
    for (let i = 0; i < n; i += step) g += `<text x="${X(i)}" y="${H - 4}" text-anchor="middle" fill="var(--muted)" font-size="11">9-${String(20 - (n - 1 - i)).padStart(2, '0')}</text>`;
    series.forEach(s => {
      const pts = s.v.map((v, i) => [X(i), Y(v)]);
      const d = smoothPath(pts);
      if (s.area) g += `<path d="${d}L${X(n - 1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="${s.c}" opacity=".12"/>`;
      g += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linecap="round"/>`;
    });
    svg.innerHTML = g;
  });
}
